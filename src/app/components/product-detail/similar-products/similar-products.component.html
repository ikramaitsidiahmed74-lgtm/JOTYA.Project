<!-- Section Produits Similaires avec Animation -->
<section class="py-12 lg:py-16" *ngIf="products.length > 0">
  
  <!-- Header -->
  <div class="text-center mb-10">
    <h2 class="text-2xl sm:text-3xl font-black text-gray-900">{{ title }}</h2>
    <p class="text-gray-500 mt-2">{{ subtitle }}</p>
  </div>

  <!-- Grille de produits avec animation staggered -->
  <div 
    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6"
    [@listAnimation]="animationKey"
  >
    <div 
      *ngFor="let product of products; trackBy: trackByProductId"
      class="group bg-white rounded-sm overflow-hidden border border-[#e5e5e5] hover:border-black transition-colors duration-200 cursor-pointer"
      tabindex="0"
      (click)="onProductClick(product.id)"
      (keyup.enter)="onProductClick(product.id)"
      [@cardAnimation]
    >
      <!-- Card Image -->
      <div class="aspect-square bg-gray-50 relative overflow-hidden">
        <img 
          [src]="product.imageUrl" 
          [alt]="product.name" 
          loading="lazy"
          class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
        />
        <span 
          *ngIf="product.badge"
          class="absolute top-3 left-3 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded-full"
          [ngClass]="getBadgeClass(product.badge)"
        >
          {{ product.badge }}
        </span>
      </div>
      
      <!-- Card Content -->
      <div class="p-4">
        <h3 class="font-bold text-gray-900 text-sm line-clamp-2 mb-2 group-hover:text-yellow-600 transition-colors">
          {{ product.name }}
        </h3>
        <div class="flex items-baseline gap-2">
          <span class="text-lg font-black text-gray-900">{{ formatPrice(product.price) }} DH</span>
          <span *ngIf="product.oldPrice" class="text-xs text-gray-400 line-through">
            {{ formatPrice(product.oldPrice) }} DH
          </span>
        </div>
      </div>
    </div>
  </div>

</section>

<!-- Message si aucun produit similaire -->
<div *ngIf="products.length === 0" class="text-center py-12">
  <p class="text-gray-400">Aucun produit similaire disponible</p>
</div>
