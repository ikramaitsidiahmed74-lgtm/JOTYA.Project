<!-- Main Catalogue Container with Background -->
<section class="min-h-screen w-full bg-background-light dark:bg-background-dark transition-colors duration-300">

<!-- Breadcrumbs -->
<div class="max-w-[1440px] mx-auto px-6 lg:px-12 py-8">
  <div class="flex items-center gap-2 mb-8 text-sm font-medium text-[#a19345]">
    <a class="hover:text-[#ffd900] transition-colors" href="/">Accueil</a>
    <span class="text-xs">›</span>
    <a routerLink="/catalogue-luxe" class="hover:text-[#ffd900] text-[#1d1a0c] transition-colors">Catalogue Luxe</a>
    <ng-container *ngIf="catalogueInfo.categoryId">
      <span class="text-xs">›</span>
      <span class="text-[#1d1a0c]">{{ catalogueInfo.categoryLabel }}</span>
    </ng-container>
  </div>

  <div class="flex flex-col lg:flex-row gap-12">
    
    <!-- SIDEBAR FILTRES -->
    <aside class="w-full lg:w-72 shrink-0 space-y-10">
      
      <!-- Categories -->
      <div>
        <h3 class="text-lg font-bold mb-5 flex items-center gap-3 text-[#1d1a0c]">
          <span
            class="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-[#ffd900]/10 text-[#1d1a0c]"
            [innerHTML]="defaultCategoryIcon"
            aria-hidden="true"
          ></span>
          Catégories
        </h3>
        <div class="space-y-1">
          <!-- Active Category Button -->
          <button
            *ngFor="let category of categories"
            (click)="onCategoryClick(category.id)"
            class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium"
            [ngClass]="isCategoryActive(category.id)
              ? 'bg-[#ffd900]/10 text-[#1d1a0c] font-bold border border-[#ffd900]/20'
              : 'hover:bg-[#f4f2e6] text-[#1d1a0c]/70 group'"
          >
            <span
              class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-[#ffd900]/30 bg-[#ffd900]/5 text-[#1d1a0c]"
              [innerHTML]="categoryIcons.get(category.id) || defaultCategoryIcon"
              aria-hidden="true"
            ></span>
            <span class="flex-1 text-left text-sm" [ngClass]="isCategoryActive(category.id) ? '' : 'uppercase tracking-wide'">
              {{ category.label }}
            </span>
            <span *ngIf="isCategoryActive(category.id)" class="text-xs opacity-60">{{ category.count || 0 }}</span>
          </button>
        </div>
      </div>

      <!-- Condition -->
      <div>
        <h3 class="text-lg font-bold mb-5 text-[#1d1a0c]">État de l'objet</h3>
        <div class="space-y-4 px-1">
          <label 
            class="flex items-center gap-3 cursor-pointer group"
            *ngFor="let state of states"
          >
            <div class="relative flex items-center">
              <input 
                type="checkbox" 
                [checked]="isStateSelected(state)"
                (change)="onStateToggle(state)"
                class="peer h-5 w-5 rounded border-2 border-[#eae5cd] text-[#ffd900] focus:ring-0 transition-all checked:bg-[#ffd900] checked:border-[#ffd900] cursor-pointer"
              />
              <span class="material-symbols-outlined absolute opacity-0 peer-checked:opacity-100 text-black text-sm left-1/2 -translate-x-1/2 pointer-events-none font-bold">check</span>
            </div>
            <span class="text-sm font-semibold group-hover:text-[#ffd900] transition-colors text-[#1d1a0c]">{{ state }}</span>
          </label>
        </div>
      </div>

      <!-- Price Range -->
      <div>
        <h3 class="text-lg font-bold mb-5 text-[#1d1a0c]">Gamme de prix (MAD)</h3>
        <div class="px-2">
          <input 
            type="range"
            [(ngModel)]="priceRange.max"
            (ngModelChange)="onPriceChange()"
            [min]="minPrice"
            [max]="maxPrice"
            class="w-full h-1.5 bg-[#eae5cd] rounded-lg appearance-none cursor-pointer accent-[#ffd900]"
          />
          <div class="flex justify-between mt-4 text-xs font-bold text-[#a19345]">
            <span>0 MAD</span>
            <span>10,000+ MAD</span>
          </div>
        </div>
      </div>

      <!-- Reset Button -->
      <button
        type="button"
        (click)="resetFilters()"
        class="btn-primary w-full py-4 uppercase tracking-widest"
      >
        Réinitialiser
      </button>
    </aside>

    <!-- PRODUCT GRID AREA -->
    <div class="flex-1">
      <!-- Toolbar -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-10 pb-6 border-b border-[#eae5cd]">
        <div class="text-sm text-[#a19345]">
          Affichage de <span class="font-bold text-[#1d1a0c]">{{ filteredProducts.length }} articles</span> de luxe
        </div>
        <div class="flex items-center gap-4">
          <span class="text-xs font-bold uppercase tracking-widest text-[#a19345]">Trier par</span>
          <div class="relative">
            <select 
              [(ngModel)]="sortBy"
              (ngModelChange)="onSortChange()"
              class="appearance-none bg-[#f4f2e6] border-none rounded-lg py-2 pl-4 pr-10 text-sm font-bold focus:ring-2 focus:ring-[#ffd900] cursor-pointer"
            >
              <option *ngFor="let option of sortOptions" [value]="option.value">
                {{ option.label }}
              </option>
            </select>
            <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-sm">unfold_more</span>
          </div>
        </div>
      </div>

      <!-- Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-8 mb-10">
        <ng-container *ngIf="displayedProducts.length > 0; else placeholderGrid">
          <app-product-card
            *ngFor="let product of displayedProducts; trackBy: trackByProductId"
            [product]="product"
            (favoriteToggle)="toggleFavorite($event)"
            (addToCart)="addToCart($event)"
            (viewDetail)="openProductDetail($event)"
          ></app-product-card>
        </ng-container>

        <ng-template #placeholderGrid>
          <app-product-card
            *ngFor="let _ of placeholderCards"
            [product]="null"
            [loading]="true"
            [showFavorite]="false"
          ></app-product-card>
        </ng-template>
      </div>

      <!-- Empty State -->
      <div *ngIf="filteredProducts.length === 0 && products.length > 0" class="text-center py-16">
        <span class="material-symbols-outlined text-6xl text-[#eae5cd] mb-4">search_off</span>
        <h3 class="text-xl font-bold text-[#1d1a0c] mb-2">Aucun article trouvé</h3>
        <p class="text-[#a19345] mb-6">Essayez de modifier vos filtres</p>
        <button
          type="button"
          (click)="resetFilters()"
          class="btn-primary px-8 py-3"
        >
          Réinitialiser les filtres
        </button>
      </div>

      <!-- Pagination -->
      <div *ngIf="totalPages > 0" class="mt-16 flex flex-col items-center gap-6">
        <!-- Load More Button -->
        <button
          *ngIf="currentPage < totalPages"
          type="button"
          (click)="loadMore()"
          class="btn-primary px-12 py-4 uppercase tracking-[0.2em] rounded-full flex items-center gap-3"
        >
          Voir plus d'articles
          <span class="material-symbols-outlined">expand_more</span>
        </button>
        
        <!-- Page Numbers -->
        <div *ngIf="totalPages > 1" class="flex gap-2">
          <button
            *ngFor="let page of getPageNumbers()"
            type="button"
            (click)="page > 0 && goToPage(page)"
            [disabled]="page === -1"
            class="size-10 rounded-full font-bold text-xs flex items-center justify-center transition-all"
            [ngClass]="page === currentPage 
              ? 'border border-[#ffd900] bg-[#ffd900] text-black'
              : page === -1 
                ? 'cursor-default'
                : 'border border-[#eae5cd] hover:border-[#ffd900]'"
          >
            {{ page === -1 ? '...' : page }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

</section>
