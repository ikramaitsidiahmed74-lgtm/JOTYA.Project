<header
  [ngClass]="fixed ? 'fixed top-0 left-0 w-full z-50' : 'relative'"
  class="w-full border-b bg-white dark:bg-[#0f0f0f] border-gray-200 dark:border-[#2d2d2d] transition-colors duration-300"
>
  <!-- ================= TOP HEADER ================= -->
  <div class="flex items-center justify-between px-6 py-4">

    <!-- LEFT: MENU + LOGO -->
    <div class="flex items-center gap-4">
      <!-- Menu icon -->
      <button
  class="group flex items-center gap-2
         text-gray-800 dark:text-gray-200 font-medium tracking-wide
         transition-all duration-200
         hover:text-black dark:hover:text-white"
  (click)="toggleMenu()"
>
  <!-- Icon -->
  <svg
    class="w-7 h-7 transition-transform duration-300 group-hover:scale-110"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    viewBox="0 0 24 24"
  >
    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
  </svg>

  <!-- Text -->
  <span
    class="text-xs md:text-sm uppercase
           tracking-[0.2em]
           select-none"
  >
    Menu
  </span>
</button>


      <!-- Logo -->
      <img
        src="/assets/logo.png"
        alt="JOTYA Logo"
        routerLink="/home"
        class="h-14 w-auto object-contain cursor-pointer
               transition-all duration-300
               hover:scale-105 hover:-translate-y-0.5
               hover:drop-shadow-[0_6px_12px_rgba(0,0,0,0.15)]"
      />
    </div>

    <!-- CENTER: SEARCH -->
    <div class="flex-1 mx-8 max-w-xl relative">
      <input
        type="text"
        placeholder="Rechercher des produits..."
        class="w-full rounded-full border px-5 py-2 pr-12 
               bg-white dark:bg-[#1f1f1f] 
               border-gray-300 dark:border-[#3d3d3d]
               text-gray-900 dark:text-gray-100
               placeholder-gray-500 dark:placeholder-gray-400
               focus:outline-none focus:ring-2 focus:ring-black dark:focus:ring-[#ffed00]
               transition-colors duration-300"
      />
      <button
        class="absolute right-4 top-1/2 -translate-y-1/2
               transition-transform duration-300 hover:scale-110 
               text-gray-600 dark:text-gray-400"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 21l-4.35-4.35M5 11a6 6 0 1112 0 6 6 0 01-12 0z"/>
        </svg>
      </button>
    </div>

    <!-- RIGHT: ICONS -->
    <div class="flex items-center gap-6">
      <!-- Dark Mode Toggle -->
      <button 
        (click)="toggleTheme()" 
        class="relative w-12 h-12 rounded-full 
               bg-gray-100 dark:bg-[#2a2a2a] 
               hover:bg-gray-200 dark:hover:bg-[#3a3a3a]
               border border-gray-200 dark:border-[#3d3d3d]
               transition-all duration-300 
               flex items-center justify-center
               group overflow-hidden"
        aria-label="Toggle dark mode">
        <!-- Sun icon (visible in dark mode) -->
        <svg 
          *ngIf="themeService.isDarkMode$ | async"
          class="w-5 h-5 text-yellow-400 transition-transform duration-300 group-hover:rotate-45"
          fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <!-- Moon icon (visible in light mode) -->
        <svg 
          *ngIf="!(themeService.isDarkMode$ | async)"
          class="w-5 h-5 text-gray-700 transition-transform duration-300 group-hover:-rotate-12"
          fill="currentColor" viewBox="0 0 24 24">
          <path d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>
        </svg>
      </button>

      <!-- Help -->
      <button routerLink="/aide" class="group">
        <svg class="w-6 h-6 text-gray-800 dark:text-gray-200 transition group-hover:scale-110 group-hover:text-[#9a9a93] dark:group-hover:text-[#ffed00]"
             fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </button>

      <!-- User -->
      <button routerLink="/auth" class="group">
        <svg class="w-6 h-6 text-gray-800 dark:text-gray-200 transition group-hover:scale-110 group-hover:text-[#9a9a93] dark:group-hover:text-[#ffed00]"
             fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M5.121 17.804A13.937 13.937 0 0112 15
                   c2.5 0 4.847.655 6.879 1.804
                   M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>

      <!-- Cart -->
      <button routerLink="/cart" class="group relative">
        <svg class="w-6 h-6 text-gray-800 dark:text-gray-200 transition group-hover:scale-110 group-hover:text-[#9a9a93] dark:group-hover:text-[#ffed00]"
             fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4
                   M7 13l-1.5 6h13M7 13l4-8m0 0h6"/>
        </svg>

        <span
          *ngIf="cartItemsCount$ | async as count"
          class="absolute -top-2 -right-2 bg-red-500 text-white
                 text-xs font-bold rounded-full h-5 w-5
                 flex items-center justify-center"
        >
          {{ count }}
        </span>
      </button>
    </div>

    <!-- CTA -->
    <button
      routerLink="/auth/vendeur-register"
      class="ml-4 flex items-center gap-2 px-4 py-2
             bg-[#ffed00] text-black text-xs md:text-sm
             font-semibold uppercase
             shadow-md hover:shadow-lg
             <!-- group-hover:text-[#ef9309] -->
             hover:-translate-y-0.5 transition "
    >
      <span class="w-4 h-4 bg-black rounded-full flex items-center justify-center">
        <svg class="w-2.5 h-2.5 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
        </svg>
      </span>
      POSTEZ VOTRE ANNONCE
    </button>

  </div>

  <!-- ================= BOTTOM NAV (TOGGLE) ================= -->
  <div
    class="border-t border-gray-200 dark:border-[#2d2d2d] 
           bg-white dark:bg-[#0f0f0f]
           overflow-hidden transition-all duration-300"
    [class.max-h-0]="!menuOpen"
    [class.max-h-[120px]]="menuOpen"
  >
    <nav class="flex justify-center gap-6 px-6 py-4 text-sm font-medium text-gray-800 dark:text-gray-200">
      <a routerLink="/catalogue-luxe" class="hover:text-[#ffed00] transition-colors">Tout le Catalogue</a>
      <a routerLink="/catalogue-luxe/vetements" class="hover:text-[#ffed00] transition-colors">Vêtements</a>
      <a routerLink="/catalogue-luxe/accessoires" class="hover:text-[#ffed00] transition-colors">Accessoires</a>
      <a routerLink="/catalogue-luxe/pieces-uniques" class="hover:text-[#ffed00] transition-colors">Pièces Uniques</a>
      <a routerLink="/catalogue-luxe/electronique" class="hover:text-[#ffed00] transition-colors">Électronique</a>
      <a routerLink="/catalogue-luxe/maison" class="hover:text-[#ffed00] transition-colors">Maison</a>
      <a routerLink="/catalogue-luxe/velo" class="hover:text-[#ffed00] transition-colors">Vélos</a>
      <a routerLink="/catalogue-luxe/construction" class="hover:text-[#ffed00] transition-colors">Construction</a>
    </nav>
  </div>

</header>
