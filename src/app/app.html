<div class="flex min-h-screen w-full">

  <!-- SIDEBAR (Dashboard only) -->
  <app-sidebar
    *ngIf="isDashboardRoute()"
    class="w-64 shrink-0">
  </app-sidebar>

  <!-- MAIN ZONE -->
  <div class="flex flex-col flex-1 min-w-0">

    <!-- HEADER (Public pages only) -->
    <app-header *ngIf="!isDashboardRoute()"></app-header>

    <!-- CONTENT -->
    <main class="flex-1 overflow-y-auto bg-gray-50">

      <div
        [ngClass]="isHomeRoute()
          ? 'w-full'
          : 'w-full px-4 sm:px-6 lg:px-8 py-6'">

        <router-outlet></router-outlet>

      </div>

    </main>

    <!-- FOOTER (Public pages only) -->
    <app-footer *ngIf="!isDashboardRoute()"></app-footer>

  </div>
</div>
