<!-- Hero Section - 3D Circular Carousel Background -->
<section class="hero-section" 
         #heroSection
         (mouseenter)="onMouseEnter()" 
         (mouseleave)="onMouseLeave()"
         aria-label="Hero section with 3D carousel">
  
  <!-- 3D Carousel Background -->
  <div class="carousel-container">
    <div class="carousel-3d" #carousel3D>
      <!-- Video Cards - 12 cards (6 vidéos × 2) disposées en cercle 3D -->
      <div 
        *ngFor="let video of VIDEOS; let i = index"
        class="hero-card hero-video-wrapper"
        [ngStyle]="getCardStyle(i)"
      >
        <video 
          #videoCard
          class="hero-video-card"
          muted 
          loop 
          playsinline
          disablePictureInPicture
          preload="none"
        >
          <source [src]="getVideoUrl(video)" type="video/mp4">
        </video>
        <!-- Subtle overlay for text readability -->
        
      </div>
    </div>
  </div>

  <!-- Gradient Overlay pour lisibilité du texte -->
  <div class="hero-gradient"></div>

  <!-- Contenu Hero - Titre et CTA (devant le carousel) -->
  <div class="hero-overlay">
    <div class="hero-content">
      
      <h1 class="hero-title">
        L9A<span class="highlight">EL HAMZA</span>
      </h1>
     
      <div class="hero-buttons">
        <a routerLink="/catalogue-luxe/vetements" class="btn-primary">
          Explorer le catalogue
        </a>
        <a routerLink="/auth/vendeur-register" class="btn-secondary">
          Devenir vendeur
        </a>
      </div>
    </div>
  </div>
</section>
