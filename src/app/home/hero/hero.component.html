<!-- Hero Section - 3D Circular Carousel Background -->
<section class="hero-section" 
         #heroSection
         (mouseenter)="onMouseEnter()" 
         (mouseleave)="onMouseLeave()"
         aria-label="Hero section with 3D carousel">
  
  <!-- 3D Carousel Background -->
  <div class="carousel-container">
    <div class="carousel-3d" #carousel3D>
      <!-- Cartes disposées en cercle 3D autour de l'axe Y -->
      <img 
        *ngFor="let photoId of DATA; let i = index"
        class="hero-card"
        [src]="getImageUrl(photoId)"
        [alt]="'Image ' + (i + 1)"
        [ngStyle]="getCardStyle(i)"
        loading="lazy"
        decoding="async"
      />
      <!-- Video Card - positioned as the last card in the 3D carousel -->
      <video 
        class="hero-card hero-video-card"
        [ngStyle]="getCardStyle(DATA.length)"
        autoplay 
        muted 
        loop 
        playsinline
        disablePictureInPicture
        preload="auto"
      >
        <source src="assets/hero vidio/Design sans titre (4) (1).mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <!-- Gradient Overlay pour lisibilité du texte -->
  <div class="hero-gradient"></div>

  <!-- Contenu Hero - Titre et CTA (devant le carousel) -->
  <div class="hero-overlay">
    <div class="hero-content">
      <span class="hero-eyebrow">Marketplace de seconde main</span>
      <h1 class="hero-title">
        Donnez une <span class="highlight">seconde vie</span> à vos objets
      </h1>
      <p class="hero-subtitle">
        Découvrez des milliers de produits uniques, vendus par des particuliers et des professionnels.
        Mode, électronique, maison et plus encore.
      </p>
      <div class="hero-buttons">
        <a routerLink="/catalogue-luxe/vetements" class="btn-primary">
          Explorer le catalogue
        </a>
        <a routerLink="/auth/vendeur-register" class="btn-secondary">
          Devenir vendeur
        </a>
      </div>
    </div>
  </div>
</section>
