<div class="space-y-6">

  <!-- HEADER -->
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">Paramètres du Compte</h1>
      <p class="text-sm text-gray-500">
        Gérez votre boutique et vos informations personnelles
      </p>
    </div>

    <button
      class="bg-[#ffed00] text-black px-4 py-2 rounded-lg
             text-sm font-semibold hover:opacity-90 transition">
      ENREGISTRER
    </button>
  </div>

  <!-- COVER -->
  <div class="relative bg-white rounded-xl shadow-sm overflow-hidden">
    <div
      class="h-40 bg-cover bg-center"
      style="background-image:url('https://images.unsplash.com/photo-1521334884684-d80222895322');">
    </div>

    <div class="absolute left-6 bottom-\[-32px]">
      <div class="w-20 h-20 rounded-lg bg-white p-1 shadow">
        <img
          src="https://i.pravatar.cc/150?img=12"
          class="w-full h-full object-cover rounded-lg"
        />
      </div>
    </div>
  </div>

  <!-- PROFIL -->
  <div class="bg-white rounded-xl p-6 shadow-sm pt-10 space-y-4">

    <h3 class="font-semibold flex items-center gap-2">
      <span class="material-symbols-outlined text-[#ffed00]">store</span>
      Profil de la Boutique
    </h3>

    <div>
      <label class="text-xs text-gray-500">Nom de la boutique</label>
      <input
        type="text"
        value="Le Vestiaire de Marc"
        class="w-full border rounded px-3 py-2 text-sm mt-1"
      />
    </div>

    <div>
      <label class="text-xs text-gray-500">Biographie</label>
      <textarea
        rows="4"
        class="w-full border rounded px-3 py-2 text-sm mt-1">
Passionné de maroquinerie de luxe et d’horlogerie depuis plus de 10 ans.
      </textarea>
    </div>
  </div>

  <!-- SECURITÉ -->
  <div class="bg-white rounded-xl p-6 shadow-sm space-y-4">

    <h3 class="font-semibold flex items-center gap-2">
      <span class="material-symbols-outlined text-[#ffed00]">lock</span>
      Sécurité
    </h3>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="text-xs text-gray-500">Adresse email</label>
        <input
          type="email"
          value="m.lefebvre@jotya.ma"
          class="w-full border rounded px-3 py-2 text-sm mt-1"
        />
      </div>

      <div>
        <label class="text-xs text-gray-500">Mot de passe</label>
        <input
          type="password"
          value="password"
          class="w-full border rounded px-3 py-2 text-sm mt-1"
        />
      </div>
    </div>
  </div>

  <!-- PAIEMENTS -->
  <div class="bg-white rounded-xl p-6 shadow-sm space-y-2">

    <h3 class="font-semibold flex items-center gap-2">
      <span class="material-symbols-outlined text-[#ffed00]">payments</span>
      Paiements & Ventes
    </h3>

    <p class="text-sm text-gray-500">
      Configurez vos informations de paiement et préférences de vente.
    </p>
  </div>

</div>
