<div class="flex justify-between items-center mb-6">
  <h1 class="text-xl font-bold">Mes Produits</h1>

 <button
  (click)="openAdd()"
  class="bg-[#ffed00] text-black px-4 py-2 rounded-lg
         text-sm font-semibold hover:opacity-90 transition">
  + Ajouter un produit
</button>

</div>

<div class="bg-white rounded-xl shadow-sm overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-gray-50 text-gray-500">
      <tr>
        <th class="text-left px-4 py-3">Produit</th>
        <th class="text-left px-4 py-3">Prix</th>
        <th class="text-left px-4 py-3">Stock</th>
        <th class="text-left px-4 py-3">Statut</th>
        <th class="text-right px-4 py-3">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr
        *ngFor="let product of products"
        class="border-t hover:bg-gray-50 transition"
      >
        <td class="px-4 py-3 flex items-center gap-3">
          <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>
          <span class="font-medium">{{ product.name }}</span>
        </td>

        <td class="px-4 py-3">
          {{ product.price }} MAD
        </td>

        <td class="px-4 py-3">
          {{ product.stock }}
        </td>

        <td class="px-4 py-3">
          <span
            class="font-medium"
            [ngClass]="{
              'text-green-600': product.status === 'En ligne',
              'text-red-500': product.status === 'Hors ligne'
            }"
          >
            {{ product.status }}
          </span>
        </td>

       <td
  (click)="openEdit(product)"
  class="px-4 py-3 text-right text-[#ffed00] font-semibold cursor-pointer">
  Modifier
</td>

      </tr>
    </tbody>
  </table>
</div>
<div
  *ngIf="showModal"
  class="fixed inset-0 bg-black/40 flex items-center justify-center z-50"
>
  <div class="bg-white rounded-xl w-full max-w-md p-6">
    <h2 class="font-bold text-lg mb-4">
      {{ isEdit ? 'Modifier produit' : 'Ajouter produit' }}
    </h2>

    <div class="space-y-3">
      <input
        [(ngModel)]="form.name"
        placeholder="Nom"
        class="w-full border rounded px-3 py-2 text-sm"
      />

      <input
        type="number"
        [(ngModel)]="form.price"
        placeholder="Prix"
        class="w-full border rounded px-3 py-2 text-sm"
      />

      <input
        type="number"
        [(ngModel)]="form.stock"
        placeholder="Stock"
        class="w-full border rounded px-3 py-2 text-sm"
      />

      <select
        [(ngModel)]="form.status"
        class="w-full border rounded px-3 py-2 text-sm"
      >
        <option>En ligne</option>
        <option>Hors ligne</option>
      </select>
    </div>

    <div class="flex justify-end gap-2 mt-6">
      <button
        (click)="showModal=false"
        class="px-4 py-2 text-sm">
        Annuler
      </button>

      <button
        (click)="save()"
        class="bg-[#ffed00] px-4 py-2 rounded text-sm font-semibold">
        Enregistrer
      </button>
    </div>
  </div>
</div>
