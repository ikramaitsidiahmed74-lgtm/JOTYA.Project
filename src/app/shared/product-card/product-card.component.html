<!-- Product Card - Design Luxe Jotya -->
<article
  class="product-card group relative bg-white dark:bg-[#2d2914] rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer"
  (click)="onCardClick()"
>
  <!-- Image Container -->
  <div class="relative aspect-[4/5] overflow-hidden">
    <ng-container *ngIf="hasData; else imagePlaceholder">
      <!-- Product Image with Zoom Effect -->
      <img
        [src]="product?.imageUrl"
        [alt]="product?.name"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
        loading="lazy"
      />

      <!-- Badge Vérifié -->
      <div *ngIf="product?.verified" class="absolute top-4 left-4">
        <div class="bg-[#ffd900]/90 backdrop-blur px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-tighter flex items-center gap-1 shadow-sm text-black">
          <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          Vérifié
        </div>
      </div>

      <!-- Favorite Button (appears on hover) -->
      <button
        *ngIf="showFavorite"
        type="button"
        (click)="onFavoriteClick($event)"
        class="absolute top-4 right-4 size-10 bg-white/80 dark:bg-black/40 backdrop-blur rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
        aria-label="Ajouter aux favoris"
      >
        <svg
          class="w-5 h-5 transition-colors"
          [ngClass]="product?.isFavorite ? 'fill-red-500 stroke-red-500' : 'fill-none stroke-current'"
          viewBox="0 0 24 24"
          stroke-width="1.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
      </button>

      <!-- Hover Overlay with Add to Cart Button -->
      <div class="cart-overlay absolute inset-0 bg-black/5 flex items-end p-4 opacity-0 transition-opacity duration-300">
        <button
          type="button"
          (click)="onAddToCart($event)"
          class="btn-primary w-full py-3 text-xs uppercase tracking-widest flex items-center justify-center gap-2"
          aria-label="Ajouter au panier"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          Ajouter au panier
        </button>
      </div>
    </ng-container>

    <!-- Loading Placeholder -->
    <ng-template #imagePlaceholder>
      <div class="absolute inset-0 shimmer bg-gradient-to-r from-[#eae5cd] via-[#f4f2e6] to-[#eae5cd]"></div>
    </ng-template>
  </div>

  <!-- Product Info -->
  <div class="p-5">
    <ng-container *ngIf="hasData; else infoPlaceholder">
      <!-- Category -->
      <p class="text-[10px] font-bold text-[#ffd900] uppercase tracking-[0.2em] mb-1">
        {{ product?.category }}
      </p>
      
      <!-- Product Name -->
      <h4 class="text-base font-bold text-[#1d1a0c] dark:text-white line-clamp-1 mb-2">
        {{ product?.name }}
      </h4>
      
      <!-- Price & State -->
      <div class="flex items-center justify-between">
        <span class="text-xl font-black text-[#1d1a0c] dark:text-white tracking-tighter">
          {{ product?.price | number: '1.0-0' }} MAD
        </span>
        <span class="text-xs font-semibold text-[#a19345]">
          {{ product?.state }}
        </span>
      </div>
    </ng-container>

    <!-- Loading Placeholder for Info -->
    <ng-template #infoPlaceholder>
      <div class="space-y-2.5 w-full">
        <div class="h-2.5 w-16 rounded-full shimmer bg-[#eae5cd]"></div>
        <div class="h-4 w-4/5 rounded-full shimmer bg-[#eae5cd]"></div>
        <div class="h-5 w-1/3 rounded-full shimmer bg-[#eae5cd]"></div>
      </div>
    </ng-template>
  </div>
</article>
