<!-- Product Card - Zara-Style Minimal Design -->
<article
  class="product-card group relative bg-transparent cursor-pointer"
  (click)="onCardClick()"
>
  <!-- Image Container -->
  <div class="relative aspect-[3/4] overflow-hidden bg-[#f5f5f5] dark:bg-[#1a1a1a]">
    <ng-container *ngIf="hasData; else imagePlaceholder">
      <!-- Product Image -->
      <img
        [src]="product?.imageUrl"
        [alt]="product?.name"
        class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-[1.03]"
        loading="lazy"
      />

      <!-- Favorite Button (top-right, appears on hover) -->
      <button
        *ngIf="showFavorite"
        type="button"
        (click)="onFavoriteClick($event)"
        class="absolute top-3 right-3 size-9 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300"
        aria-label="Ajouter aux favoris"
      >
        <svg
          class="w-5 h-5 transition-colors"
          [ngClass]="product?.isFavorite ? 'fill-red-500 stroke-red-500' : 'fill-none stroke-[#1a1a1a] dark:stroke-white'"
          viewBox="0 0 24 24"
          stroke-width="1.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
      </button>
    </ng-container>

    <!-- Loading Placeholder -->
    <ng-template #imagePlaceholder>
      <div class="absolute inset-0 shimmer bg-gradient-to-r from-[#eee] via-[#f8f8f8] to-[#eee]"></div>
    </ng-template>
  </div>

  <!-- Product Info - Zara style: name + price row with + button -->
  <div class="pt-3 pb-2">
    <ng-container *ngIf="hasData; else infoPlaceholder">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0 flex-1">
          <!-- Product Name -->
          <h4 class="text-[11px] font-normal text-[#1a1a1a] dark:text-white uppercase tracking-wide leading-snug line-clamp-2 mb-1">
            {{ product?.name }}
          </h4>
          <!-- Price -->
          <p class="text-[11px] text-[#1a1a1a] dark:text-gray-300">
            {{ product?.price | number: '1.2-2' }} MAD
          </p>
        </div>
        <!-- Add to cart + button -->
        <button
          type="button"
          (click)="onAddToCart($event)"
          class="flex-shrink-0 mt-0.5 size-7 flex items-center justify-center text-[#1a1a1a] dark:text-white hover:text-[#555] transition-colors"
          aria-label="Ajouter au panier"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </button>
      </div>
    </ng-container>

    <!-- Loading Placeholder for Info -->
    <ng-template #infoPlaceholder>
      <div class="space-y-2 w-full">
        <div class="h-3 w-3/4 rounded shimmer bg-[#eee]"></div>
        <div class="h-3 w-1/3 rounded shimmer bg-[#eee]"></div>
      </div>
    </ng-template>
  </div>
</article>
