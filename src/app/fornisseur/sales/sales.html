<div class="space-y-6">

  <!-- HEADER -->
  <div>
    <h1 class="text-xl font-bold">Ventes</h1>
    <p class="text-sm text-gray-500">Résumé de vos performances</p>
  </div>

  <!-- STATS -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <div
      *ngFor="let stat of stats"
      class="bg-white rounded-xl p-5 shadow-sm"
    >
      <p class="text-xs text-gray-500 uppercase">{{ stat.label }}</p>
      <p class="text-2xl font-bold mt-1">{{ stat.value }}</p>
    </div>
  </div>

  <!-- GRAPH -->
  <div class="bg-white rounded-xl p-5 shadow-sm">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-semibold">Évolution des ventes</h3>
      <select class="text-sm border rounded-md px-2 py-1">
        <option>7 jours</option>
        <option>30 jours</option>
        <option>12 mois</option>
      </select>
    </div>

    <div class="h-52 flex items-center justify-center text-gray-400 text-sm">
      📈 Graph ici (Chart.js plus tard)
    </div>
  </div>

  <!-- TABLE -->
  <div class="bg-white rounded-xl p-5 shadow-sm">
    <h3 class="font-semibold mb-4">Dernières ventes</h3>

    <table class="w-full text-sm">
      <thead class="text-gray-400 text-xs border-b">
        <tr>
          <th class="text-left py-2">PRODUIT</th>
          <th>CLIENT</th>
          <th>PRIX</th>
          <th>DATE</th>
          <th>STATUT</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let sale of sales"
          class="border-b last:border-none"
        >
          <td class="py-3 font-medium">{{ sale.product }}</td>
          <td>{{ sale.client }}</td>
          <td>{{ sale.price }}</td>
          <td>{{ sale.date }}</td>
          <td>
            <span
              class="text-xs px-2 py-1 rounded"
              [ngClass]="{
                'bg-green-100 text-green-600': sale.status === 'Payé',
                'bg-yellow-100 text-yellow-600': sale.status === 'En attente'
              }"
            >
              {{ sale.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
