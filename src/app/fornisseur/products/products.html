<div class="flex justify-between items-center mb-6">
  <h1 class="text-xl font-bold">Mes Produits</h1>

  <button
    (click)="goToAddProduct()"
    class="bg-[#ffed00] text-black px-4 py-2 rounded-lg text-sm font-semibold hover:opacity-90 transition cursor-pointer hover:shadow-md"
    aria-label="Ajouter un produit"
  >
    + Ajouter un produit
  </button>
</div>

<div class="bg-white rounded-xl shadow-sm overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-gray-50 text-gray-500">
      <tr>
        <th class="text-left px-4 py-3">Produit</th>
        <th class="text-left px-4 py-3">Prix</th>
        <th class="text-left px-4 py-3">Stock</th>
        <th class="text-left px-4 py-3">Statut</th>
        <th class="text-right px-4 py-3">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let product of products" class="border-t hover:bg-gray-50 transition">
        <td class="px-4 py-3 flex items-center gap-3">
          <div class="w-10 h-10 bg-gray-200 rounded-lg"></div>
          <span class="font-medium">{{ product.name }}</span>
        </td>

        <td class="px-4 py-3">{{ product.price }} MAD</td>

        <td class="px-4 py-3">
          {{ product.stock }}
        </td>

        <td class="px-4 py-3">
          <span
            class="font-medium"
            [ngClass]="{
              'text-green-600': product.status === 'En ligne',
              'text-red-500': product.status === 'Hors ligne',
            }"
          >
            {{ product.status }}
          </span>
        </td>

        <td class="px-4 py-3 text-right">
          <div class="inline-flex items-center gap-3 justify-end">
            <button (click)="openEdit(product)" class="text-[#ffed00] font-semibold text-sm">Modifier</button>
            <button (click)="deleteProduct(product)" [disabled]="loadingDelete[product.id]" class="text-red-500 font-semibold text-sm">
              <span *ngIf="loadingDelete[product.id]">Supp.</span>
              <span *ngIf="!loadingDelete[product.id]">Supprimer</span>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
