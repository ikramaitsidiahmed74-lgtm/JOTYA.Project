<div
  *ngIf="showLogoutModal"
  class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
>
  <div class="bg-white rounded-2xl w-full max-w-sm p-6 text-center">

    <!-- ICON -->
    <div
      class="w-12 h-12 mx-auto mb-4 rounded-full
             bg-red-100 flex items-center justify-center">
      <span class="material-symbols-outlined text-red-500">
        logout
      </span>
    </div>

    <!-- TITLE -->
    <h2 class="font-bold text-lg mb-1">
      Déconnexion
    </h2>

    <p class="text-sm text-gray-500 mb-6">
      Voulez-vous vraiment vous déconnecter de votre compte vendeur ?
    </p>

    <!-- ACTIONS -->
    <div class="space-y-2">
      <button
        (click)="closeLogout()"
        class="w-full bg-gray-900 text-white py-2 rounded-lg
               text-sm font-semibold hover:opacity-90 transition">
        Annuler
      </button>

      <button
        (click)="logout()"
        class="w-full bg-red-100 text-red-600 py-2 rounded-lg
               text-sm font-semibold hover:bg-red-200 transition">
        Se déconnecter
      </button>
    </div>

  </div>
</div>
