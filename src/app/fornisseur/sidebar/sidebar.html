<aside class="fixed top-0 left-0 w-64 h-screen bg-black text-white z-50 flex-1 overflow-y-auto">
  <!-- TOP -->
  <div class="p-8">
    <!-- LOGO -->
    <div class="flex items-center justify-start mb-8">
      <div class="overflow-hidden flex items-center justify-center">
        <!-- حيدنا rounded-full باش ما يكونش دايري -->
        <img src="assets/logo s w.png" alt="Logo Jotya" class="w-40 h-auto object-contain" />
      </div>
    </div>

    <!-- NAVIGATION -->
    <nav class="flex flex-col gap-2">
      <!-- Dashboard -->
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-gray-800 !text-[#ffed00]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-4 px-3 py-3 rounded-lg text-slate-400 hover:text-[#ffed00] hover:bg-[#ffed00]/10 transition"
      >
        <span class="material-symbols-outlined">dashboard</span>
        <span class="text-sm font-medium">Tableau de Bord</span>
      </a>

      <!-- Produits -->
      <a
        routerLink="/products"
        routerLinkActive="bg-gray-800 !text-[#ffed00]"
        class="flex items-center gap-4 px-3 py-3 rounded-lg text-slate-400 hover:text-[#ffed00] hover:bg-[#ffed00]/10 transition"
      >
        <span class="material-symbols-outlined">inventory_2</span>
        <span class="text-sm">Mes Produits</span>
      </a>

      <!-- Ventes -->
      <a
        routerLink="/sales"
        routerLinkActive="bg-gray-800 !text-[#ffed00]"
        class="flex items-center gap-4 px-3 py-3 rounded-lg text-slate-400 hover:text-[#ffed00] hover:bg-[#ffed00]/10 transition"
      >
        <span class="material-symbols-outlined">trending_up</span>
        <span class="text-sm">Ventes</span>
      </a>

      <!-- Commandes -->
      <a
        routerLink="/orders"
        routerLinkActive="bg-gray-800 !text-[#ffed00]"
        class="flex items-center gap-4 px-3 py-3 rounded-lg text-slate-400 hover:text-[#ffed00] hover:bg-[#ffed00]/10 transition"
      >
        <span class="material-symbols-outlined">shopping_cart</span>
        <span class="text-sm">Commandes</span>
      </a>

      <!-- Messages -->
      <a
        routerLink="/messages"
        routerLinkActive="bg-gray-800 !text-[#ffed00]"
        class="flex items-center gap-4 px-3 py-3 rounded-lg text-slate-400 hover:text-[#ffed00] hover:bg-[#ffed00]/10 transition"
      >
        <span class="material-symbols-outlined">chat</span>
        <span class="text-sm flex-1">Messages</span>

        <span class="bg-[#ffed00] text-black text-[10px] px-1.5 py-0.5 rounded-full font-bold">
          4
        </span>
      </a>
    </nav>
  </div>

  <!-- BOTTOM -->
  <div class="p-8 border-t border-white/10">
    <nav class="flex flex-col gap-2 mb-6">
      <!-- Settings -->
      <a
        routerLink="/settings"
        routerLinkActive="bg-gray-800 text-[#ffed00]"
        class="flex items-center gap-4 px-3 py-3 rounded-lg text-slate-400 hover:text-[#ffed00] hover:bg-[#ffed00]/10 transition"
      >
        <span class="material-symbols-outlined">settings</span>
        <span class="text-sm">Paramètres</span>
      </a>

      <!-- Logout -->
      <a
        routerLink="/connexion"
        (click)="openLogout()"
        class="flex items-center gap-4 px-3 py-3 rounded-lg text-red-400 hover:text-red-300 transition cursor-pointer"
      >
        <span class="material-symbols-outlined">logout</span>
        <span class="text-sm">Déconnexion</span>
      </a>
    </nav>

    <!-- PROFILE -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-slate-700 border border-white/20"></div>
      <div>
        <p class="text-xs font-bold truncate">Marc Lefebvre</p>
        <p class="text-[10px] text-[#ffed00] font-semibold truncate">Vendeur Certifié</p>
      </div>
    </div>
  </div>
</aside>
