<div class="flex min-h-screen bg-[#FFFBF2]">
  <!-- Sidebar -->
  <app-sidebar-admin class="w-64 shrink-0"></app-sidebar-admin>

  <!-- Content -->
  <div class="flex-1 flex flex-col">
    <!-- Header -->
    <header class="fixed top-0 left-64 right-0 z-50 bg-[#FFFBF2] border-b border-gray-200">
      <div class="px-6 py-3 flex items-center justify-between">
        <!-- Left -->
        <h2 class="text-sm font-medium text-gray-700">{{ title }}</h2>

        <!-- Right -->
        <div class="flex items-center gap-4">
          <!-- Search -->
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"
              >search</span
            >
            <input
              type="text"
              [attr.placeholder]="searchPlaceholder"
              class="pl-9 pr-4 py-2 text-sm rounded-lg border border-gray-200 bg-white focus:outline-none focus:ring-2 focus:ring-yellow-400 w-72"
            />
          </div>

          <!-- Notification -->
          <div class="relative cursor-pointer">
            <span class="material-symbols-outlined text-gray-700">notifications</span>
            <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main -->
    <main class="flex-1 px-6 py-4 overflow-y-auto pt-16">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
